[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # onnxruntime-node (dep of transformers.js) tries to download CUDA binaries on
  # Linux; that release URL now returns 404 and fails npm install. Not needed in the browser.
  ONNXRUNTIME_NODE_INSTALL_CUDA = "skip"

# Installable app: the service worker must never be served stale
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# SPA redirect - all routes go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
