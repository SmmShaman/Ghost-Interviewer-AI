name = "ghost-interviewer-api"
main = "src/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "ghost.vitalii.no", custom_domain = true }
]

# Test logs of the app (POST/GET /api/logs)
[[d1_databases]]
binding = "LOGS_DB"
database_name = "ghost-test-logs"
database_id = "80cc2afa-335a-4a22-8a76-5bf438dfa20e"

[vars]
ENVIRONMENT = "production"
# Only these Google accounts may sign in (comma-separated)
ALLOWED_EMAILS = "stuardbmw@gmail.com"

# Neon DB connection will be set via secrets:
# npx wrangler secret put DATABASE_URL
